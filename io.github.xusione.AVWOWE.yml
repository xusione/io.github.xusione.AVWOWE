app-id: io.github.xusione.AVWOWE
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: run.sh

finish-args:
  # Display & GPU Access
  - --socket=x11
  - --socket=wayland
  - --device=dri
  # Audio Access
  - --socket=pulseaudio
  # Filesystem Access
  - --filesystem=home

modules:
  - name: glfw
    buildsystem: cmake-ninja
    config-opts:
      - -DBUILD_SHARED_LIBS=ON
      - -DGLFW_BUILD_EXAMPLES=OFF
      - -DGLFW_BUILD_TESTS=OFF
      - -DGLFW_BUILD_DOCS=OFF
    sources:
      - type: archive
        url: https://github.com/glfw/glfw/archive/refs/tags/3.4.tar.gz
        sha256: c038d34200234d071fae9345bc455e4a8f2f544ab60150765d7704e08f3dac01

  - name: avwowe
    buildsystem: simple
    build-commands:
      # Install wrapper script
      - install -D -m 755 run.sh /app/bin/run.sh

      # Install binary
      - install -D -m 755 AVWOWE /app/bin/AVWOWE

      # Copy data directory into /app/bin/data
      - cp -r data /app/bin/data

      # Install Desktop entry, Metainfo, and Icon
      - install -D -m 644 io.github.xusione.AVWOWE.desktop /app/share/applications/io.github.xusione.AVWOWE.desktop
      - install -D -m 644 io.github.xusione.AVWOWE.metainfo.xml /app/share/metainfo/io.github.xusione.AVWOWE.metainfo.xml
      - install -D -m 644 io.github.xusione.AVWOWE.png /app/share/icons/hicolor/512x512/apps/io.github.xusione.AVWOWE.png

    sources:
      - type: file
        path: run.sh
      - type: file
        path: bin/AVWOWE
      - type: dir
        path: data
        dest: data
      - type: file
        path: io.github.xusione.AVWOWE.desktop
      - type: file
        path: io.github.xusione.AVWOWE.metainfo.xml
      - type: file
        path: io.github.xusione.AVWOWE.png